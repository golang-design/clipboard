name: clipboard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  platform_test:
    env:
      DISPLAY: ':0.0'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.24.x']
    steps:
    - name: Install and run dependencies (xvfb libx11-dev)
      if: ${{ runner.os == 'Linux' }}
      run: |
        sudo apt update
        sudo apt install -y xvfb libx11-dev x11-utils libegl1-mesa-dev libgles2-mesa-dev xclip
        Xvfb :0 -screen 0 1024x768x24 > /dev/null 2>&1 &
        # Wait for Xvfb
        MAX_ATTEMPTS=120 # About 60 seconds
        COUNT=0
        echo -n "Waiting for Xvfb to be ready..."
        while ! xdpyinfo -display "${DISPLAY}" >/dev/null 2>&1; do
          echo -n "."
          sleep 0.50s
          COUNT=$(( COUNT + 1 ))
          if [ "${COUNT}" -ge "${MAX_ATTEMPTS}" ]; then
            echo "  Gave up waiting for X server on ${DISPLAY}"
            exit 1
          fi
        done
        echo "Done - Xvfb is ready!"

    - uses: actions/checkout@v2
    - uses: actions/setup-go@v2
      with:
        stable: 'false'
        go-version: ${{ matrix.go }}

    - name: Build (${{ matrix.go }})
      run: |
        go build -o gclip cmd/gclip/main.go
        go build -o gclip-gui cmd/gclip-gui/main.go

    - name: Run Tests with CGO_ENABLED=1 (${{ matrix.go }})
      if: ${{ runner.os == 'Linux' || runner.os == 'macOS'}}
      run: |
        CGO_ENABLED=1 go test -v -covermode=atomic .

    - name: Run Tests with CGO_ENABLED=0 (${{ matrix.go }})
      if: ${{ runner.os == 'Linux' || runner.os == 'macOS'}}
      run: |
        CGO_ENABLED=0 go test -v -covermode=atomic .

    - name: Run Tests on Windows (${{ matrix.go }})
      if: ${{ runner.os == 'Windows'}}
      run: |
        go test -v -covermode=atomic .

  # The clipboard package previously hung on 32-bit Windows (#45). Make
  # sure it keeps compiling for GOARCH=386. The runtime behavior cannot be
  # exercised here because GitHub-hosted runners are amd64 only.
  windows_386_build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-go@v2
      with:
        stable: 'false'
        go-version: '1.24.x'
    - name: Build for windows/386
      env:
        GOOS: windows
        GOARCH: 386
      run: |
        go build .
        go build ./cmd/gclip

  # The BSDs are not available as GitHub-hosted runners, so build the X11
  # cgo path inside a VM to make sure it keeps compiling (see #55). The
  # clipboard needs a running X server at runtime, which is out of scope
  # for these build-only jobs.
  freebsd_build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Build on FreeBSD
      uses: vmactions/freebsd-vm@v1
      with:
        usesh: true
        prepare: |
          pkg install -y go libX11
        run: |
          go version
          CGO_ENABLED=1 go build .
          CGO_ENABLED=1 go build ./cmd/gclip

  openbsd_build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Build on OpenBSD
      uses: vmactions/openbsd-vm@v1
      with:
        usesh: true
        prepare: |
          pkg_add -I go
        run: |
          go version
          CGO_ENABLED=1 go build .
          CGO_ENABLED=1 go build ./cmd/gclip

  # Exercise the native Wayland backend against a headless sway compositor.
  # sway implements a data-control manager (zwlr_data_control_manager_v1),
  # which the Wayland clipboard backend needs and which weston/cage do not.
  wayland_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-go@v2
      with:
        stable: 'false'
        go-version: '1.24.x'
    - name: Install sway and X11 dev headers
      run: |
        sudo apt update
        sudo apt install -y sway libx11-dev wl-clipboard
    - name: Run Wayland tests under headless sway
      run: |
        export XDG_RUNTIME_DIR="${RUNNER_TEMP}/xdg"
        mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
        export WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman
        printf 'exec "go test -count=1 -covermode=atomic -run Wayland -v . > /tmp/res.txt 2>&1; echo EXIT=$? >> /tmp/res.txt; swaymsg exit"\n' > /tmp/sway.conf
        timeout 180 sway -c /tmp/sway.conf || true
        echo "----- go test output -----"
        cat /tmp/res.txt
        grep -q "^EXIT=0$" /tmp/res.txt